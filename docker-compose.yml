services:
  redis:
    image: redis:7-alpine
    container_name: godotlaunch-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - seaweedfs-net
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: godotlaunch-postgres
    environment:
      POSTGRES_DB: godot_launch
      POSTGRES_USER: user_godot_launch
      POSTGRES_PASSWORD: password_godot_launch
    ports:
      - "5435:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - seaweedfs-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d godot_launch" ]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-master
    command: master -ip=seaweedfs-master -port=9333
    ports:
      - "9333:9333"
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./localtime:/etc/localtime:ro
      - ./localtime:/usr/share/zoneinfo/Asia/Ho_Chi_Minh:ro
    networks:
      - seaweedfs-net
    restart: unless-stopped

  seaweedfs-volume:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-volume
    command: volume -mserver=seaweedfs-master:9333 -port=8081 -dir=/data -publicUrl=localhost:8081
    ports:
      - "8081:8081"
    volumes:
      - seaweedfs-data:/data
      - ./localtime:/etc/localtime:ro
      - ./localtime:/usr/share/zoneinfo/Asia/Ho_Chi_Minh:ro
    environment:
      - TZ=Asia/Ho_Chi_Minh
    depends_on:
      - seaweedfs-master
    networks:
      - seaweedfs-net
    restart: unless-stopped

  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-filer
    command: filer -master=seaweedfs-master:9333 -port=8888 -port.grpc=18888
    ports:
      - "8888:8888"
      - "18888:18888"
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./localtime:/etc/localtime:ro
      - ./localtime:/usr/share/zoneinfo/Asia/Ho_Chi_Minh:ro
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume
    networks:
      - seaweedfs-net
    restart: unless-stopped

  ai-service:
    build: ./python-face-service
    container_name: godotlaunch-ai-service
    ports:
      - "8001:8001"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=godot_launch
      - DB_USER=user_godot_launch
      - DB_PASSWORD=password_godot_launch
      - FACE_SIMILARITY_THRESHOLD=0.5
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/gcp-vision.json
      # AI review — DeepSeek text (đổ key thật vào .env hoặc shell env). Trống → module DeepSeek bị skip.
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      # Self-host model HF (CLIP, NSFW) — tên model có thể override
      - CLIP_MODEL=${CLIP_MODEL:-openai/clip-vit-base-patch32}
      - NSFW_MODEL=${NSFW_MODEL:-Falconsai/nsfw_image_detection}
      - HF_HOME=/models
    volumes:
      - ./python-face-service/gcp-vision.json:/run/secrets/gcp-vision.json:ro
      - hf-model-cache:/models
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - seaweedfs-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  clamav:
    image: clamav/clamav:latest
    container_name: clamav_scanner
    ports:
      - "3310:3310"
    networks:
      - seaweedfs-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "clamdscan", "--ping" ]
      interval: 30s
      timeout: 10s
      retries: 3

  mongodb:
    image: mongo:latest
    container_name: godotlaunch-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - seaweedfs-net
    restart: unless-stopped

volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local
  seaweedfs-data:
    driver: local
  hf-model-cache:
    driver: local
  mongodb-data:
    driver: local

networks:
  seaweedfs-net:
    driver: bridge
