version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: godotlaunch-postgres
    environment:
      POSTGRES_DB: godot_launch
      POSTGRES_USER: user_godot_launch
      POSTGRES_PASSWORD: "password_godot_launch"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - seaweedfs-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_godot_launch -d godot_launch"]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-master
    command: master -ip=seaweedfs-master -port=9333
    ports:
      - "9333:9333"
    networks:
      - seaweedfs-net
    restart: unless-stopped

  seaweedfs-volume:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-volume
    command: volume -mserver=seaweedfs-master:9333 -port=8081 -dir=/data -publicUrl=localhost:8081
    ports:
      - "8081:8081"
    volumes:
      - seaweedfs-data:/data
    depends_on:
      - seaweedfs-master
    networks:
      - seaweedfs-net
    restart: unless-stopped

  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-filer
    command: filer -master=seaweedfs-master:9333 -port=8888 -port.grpc=18888
    ports:
      - "8888:8888"
      - "18888:18888"
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume
    networks:
      - seaweedfs-net
    restart: unless-stopped

  clamav:
    image: clamav/clamav:latest
    container_name: clamav_scanner
    ports:
      - "3310:3310"
    networks:
      - seaweedfs-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clamdscan", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres-data:
    driver: local
  seaweedfs-data:
    driver: local

networks:
  seaweedfs-net:
    driver: bridge
