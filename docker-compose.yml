  clamav:
    image: clamav/clamav:latest
    container_name: clamav_scanner
    ports:
      - "3310:3310"
    networks:
      - seaweedfs-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "clamdscan", "--ping" ]
      interval: 30s
      timeout: 10s
      retries: 3

  mongodb:
    image: mongo:latest
    container_name: godotlaunch-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - seaweedfs-net
    restart: unless-stopped

volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local
  seaweedfs-data:
    driver: local
  hf-model-cache:
    driver: local
  mongodb-data:
    driver: local

networks:
  seaweedfs-net:
    driver: bridge
