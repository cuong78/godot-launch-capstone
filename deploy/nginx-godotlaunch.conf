server {
    listen 80;
    listen [::]:80;
    server_name godotlaunch.shop www.godotlaunch.shop app.godotlaunch.shop;

    client_max_body_size 300m;

    # Route riêng cho upload ZIP — stream trực tiếp, không buffer, timeout dài
    location ~* ^/api/v1/(games|assets)/[^/]+/upload-unified$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Không buffer request body — stream thẳng lên backend
        proxy_request_buffering off;
        # Tăng timeout để không bị cắt khi file lớn
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;
        # Không buffer response về client
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /files/ {
        # SeaweedFS stores objects below its configured /godotlaunch base path.
        # Keep the public URL as /files/<object-key> while proxying to
        # /godotlaunch/<object-key> inside the Filer.
        rewrite ^/files/(.*)$ /godotlaunch/$1 break;
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        # Stream objects directly; do not write proxy buffers to the full disk.
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
