debug: false

logging:
  level:
    com.godotlaunch.backend: DEBUG
    org.springframework.web: INFO
    org.springframework.messaging: DEBUG

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:backend/.env[.properties]

  application:
    name: backend
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
      - org.springframework.ai.autoconfigure.vectorstore.pgvector.PgVectorStoreAutoConfiguration
  ai:
    openai:
      base-url: ${GEMINI_OPENAI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
      api-key: ${GEMINI_API_KEY:}
      chat:
        options:
          model: ${GEMINI_MODEL:gemini-flash-lite-latest}
          temperature: 0.2
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE
        dimensions: 768
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/godot_launch?uuidRepresentation=standard}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/godot_launch}
    username: ${DB_USERNAME:user_godot_launch}
    password: ${DB_PASSWORD:password_godot_launch}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: false
    repair-on-migrate: true
    out-of-order: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  messages:
    basename: classpath:i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false


app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  backend-url: ${BACKEND_URL:http://localhost:8080}

  game-version-notifications:
    fixed-delay-ms: ${GAME_VERSION_NOTIFICATION_DELAY_MS:5000}

  ai-review:
    plagiarism:
      review-threshold: ${PLAGIARISM_REVIEW_THRESHOLD:0.70}
      reject-threshold: ${PLAGIARISM_REJECT_THRESHOLD:0.90}
      top-n: ${PLAGIARISM_TOP_N:10}

  vietqr:
    lookup:
      # banklookup.net Account Lookup API — tra tên chủ tài khoản thật từ STK
      # + mã ngân hàng dạng code (vd "VCB", "MB" — KHÁC BIN NAPAS). Đổi từ
      # VietQR.io vì gói Free của VietQR.io ngừng hỗ trợ Account Lookup từ
      # 20/08/2024. KHÁC hoàn toàn bộ credential VietQR Host2Host (tạo QR
      # nhận tiền) đã có sẵn trong .env.
      base-url: ${VIETQR_LOOKUP_BASE_URL:https://api.banklookup.net}
      client-id: ${VIETQR_LOOKUP_CLIENT_ID:}
      api-key: ${VIETQR_LOOKUP_API_KEY:}

  security:
    encryption-key: ${ENCRYPTION_KEY}
    recaptcha:
      secret-key: ${RECAPTCHA_SECRET_KEY:}
    oauth:
      google:
        client-id: ${GOOGLE_CLIENT_ID}
      github:
        client-id: ${GITHUB_CLIENT_ID:}
        client-secret: ${GITHUB_CLIENT_SECRET:}
        redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/api/v1/auth/github/callback}
        # Bot account (machine user) để clone private repo developer mời
        bot-username: ${GITHUB_BOT_USERNAME:}
        bot-token: ${GITHUB_BOT_TOKEN:}
  google-play:
    mock: ${GOOGLE_PLAY_MOCK:true}
    poll-interval-ms: ${GOOGLE_PLAY_POLL_INTERVAL_MS:1800000}
    mock-review-delay-seconds: ${GOOGLE_PLAY_MOCK_REVIEW_DELAY_SECONDS:30}
    service-account-path: ${GOOGLE_PLAY_SERVICE_ACCOUNT_PATH:}
    package-name: ${GOOGLE_PLAY_PACKAGE_NAME:}
    track: ${GOOGLE_PLAY_TRACK:production}

  payos:
    payment:
      client-id: ${PAYOS_PAYMENT_CLIENT_ID:${PAYOS_CLIENT_ID:}}
      api-key: ${PAYOS_PAYMENT_API_KEY:${PAYOS_API_KEY:}}
      checksum-key: ${PAYOS_PAYMENT_CHECKSUM_KEY:${PAYOS_CHECKSUM_KEY:}}
    payout:
      client-id: ${PAYOS_PAYOUT_CLIENT_ID:${PAYOS_CLIENT_ID:}}
      api-key: ${PAYOS_PAYOUT_API_KEY:${PAYOS_API_KEY:}}
      checksum-key: ${PAYOS_PAYOUT_CHECKSUM_KEY:${PAYOS_CHECKSUM_KEY:}}

storage:
  seaweedfs:
    filer-host: ${SEAWEEDFS_FILER_HOST:localhost}
    filer-port: ${SEAWEEDFS_FILER_PORT:8888}
    public-host: ${SEAWEEDFS_PUBLIC_HOST:localhost}
    public-port: ${SEAWEEDFS_PUBLIC_PORT:8888}
    base-path: ${SEAWEEDFS_BASE_PATH:/godotlaunch}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

