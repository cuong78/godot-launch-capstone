debug: false
spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/godot_launch}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: validate       # ← đổi lại validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET:godot-launch-storage}
    region: ${AWS_S3_REGION:ap-southeast-2}
  credentials:
    access-key: ${AWS_ACCESS_KEY:dummy-access-key}
    secret-key: ${AWS_SECRET_KEY:dummy-secret-key}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  security:
    encryption-key: ${ENCRYPTION_KEY:godot-launch-encrypt-key-12345}
    oauth:
      google:
        client-id: ${GOOGLE_CLIENT_ID:}
      github:
        client-id: ${GITHUB_CLIENT_ID:}
        client-secret: ${GITHUB_CLIENT_SECRET:}