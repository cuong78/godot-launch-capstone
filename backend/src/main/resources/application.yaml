debug: false
logging:
  level:
    com.godotlaunch.backend: DEBUG
    org.springframework.web: INFO
    org.springframework.messaging: DEBUG
    org.flywaydb: DEBUG
spring:
  application:
    name: backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: validate       
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: false
    repair-on-migrate: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET:placeholder-bucket}
    region: ${AWS_S3_REGION:ap-southeast-1}
  credentials:
    access-key: ${AWS_ACCESS_KEY:placeholder-access-key}
    secret-key: ${AWS_SECRET_KEY:placeholder-secret-key}

app:
  frontend-url: ${FRONTEND_URL}
  face-service:
    url: ${FACE_SERVICE_URL:http://localhost:8001}
  security:
    encryption-key: ${ENCRYPTION_KEY}
    recaptcha:
      secret-key: ${RECAPTCHA_SECRET_KEY:}
    oauth:
      google:
        client-id: ${GOOGLE_CLIENT_ID}
      github:
        client-id: ${GITHUB_CLIENT_ID}
        client-secret: ${GITHUB_CLIENT_SECRET}