debug: false

logging:
  level:
    com.godotlaunch.backend: DEBUG
    org.springframework.web: INFO
    org.springframework.messaging: DEBUG

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:backend/.env[.properties]

  application:
    name: backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/godot_launch?uuidRepresentation=standard}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/godot_launch}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:12345}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: false
    repair-on-migrate: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  messages:
    basename: classpath:i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false

aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET:placeholder-bucket}
    region: ${AWS_S3_REGION:ap-southeast-1}
  credentials:
    access-key: ${AWS_ACCESS_KEY:placeholder-access-key}
    secret-key: ${AWS_SECRET_KEY:placeholder-secret-key}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

  security:
    encryption-key: ${ENCRYPTION_KEY}
    recaptcha:
      secret-key: ${RECAPTCHA_SECRET_KEY:}
    oauth:
      google:
        client-id: ${GOOGLE_CLIENT_ID}
      github:
        client-id: ${GITHUB_CLIENT_ID:}
        client-secret: ${GITHUB_CLIENT_SECRET:}
        redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/api/v1/auth/github/callback}
        # Bot account (machine user) để clone private repo developer mời
        bot-username: ${GITHUB_BOT_USERNAME:}
        bot-token: ${GITHUB_BOT_TOKEN:}
  payos:
    payment:
      client-id: ${PAYOS_PAYMENT_CLIENT_ID:${PAYOS_CLIENT_ID:}}
      api-key: ${PAYOS_PAYMENT_API_KEY:${PAYOS_API_KEY:}}
      checksum-key: ${PAYOS_PAYMENT_CHECKSUM_KEY:${PAYOS_CHECKSUM_KEY:}}
    payout:
      client-id: ${PAYOS_PAYOUT_CLIENT_ID:${PAYOS_CLIENT_ID:}}
      api-key: ${PAYOS_PAYOUT_API_KEY:${PAYOS_API_KEY:}}
      checksum-key: ${PAYOS_PAYOUT_CHECKSUM_KEY:${PAYOS_CHECKSUM_KEY:}}
